
general:
  gpu: 1
  checkpoint: /data/sjlee/EventSAM/checkpoints/ALL/seal_small_6

dataset:
  dir: /dataset/sjlee/SEAL
  test:
    name: DSEC-PART
    batch_size: 1
    data: DSEC-PART_val_list.txt
    gt: part_mask_gt
    img_width: 512
    semantic_width: 256
    shuffle: False
    prompt: box
    classifier: /data/sjlee/EventSAM/classifier/DSEC_PART.pt
  
model:
  mask_levels: ['l', 'm', 's']
  num_mask_tokens: 0
  output_dim: 768
  roi: True
  use_decoder: False
  semantic_width: 256
  backbone:
    model_type: vit_b
    input_signal: evimg
    encoder_checkpoint: /data/sjlee/EventSAM/eventsam_checkpoints/ALL/rgbe_encoder_04_iter.pth
    decoder_checkpoint: /data/sjlee/EventSAM/pretrained/sam_vit_b_01ec64.pth
  neck:
    name: MultiLayerSAMTransformerNeck
    input_size: [32, 32]
    in_channels: 768
    embed_channels: 256
    out_channels: 256
    depth: 6
    global_attn_indexes: [5]
    window_size: 14
    num_heads: 16
    mlp_ratio: 4
    use_rel_pos: True
    rel_pos_zero_init: True
    multimodal_fusion: True
    num_event_modality_prompt: 0
    event_prompt_in_cross_attn: False
  in_proj:
    in_channels: 512
  position:
    embed_channels: 256
  aggregate:
    embed_channels: 256
  roi_pool:
    output_size: [7, 7]
    spatial_scale: 1.0 # FIXME:
    sampling_ratio: -1
    aligned: True
  loss:
    name: CosineSimilarity
    reduction: mean
    weight: 1.0
    normalize: False
    dim: -1

